name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Só Node: confere sintaxe dos .js e chaves dos .css (sem baixar o Electron).
      - run: node scripts/check.js
      - run: node scripts/test-iv.js
      - run: node scripts/test-route-afk.js
      - run: node scripts/test-afk-isolation.js
      - run: node scripts/test-afk-parallel.js
      - run: node scripts/test-account-close.js
      - run: node scripts/test-chat-plus.js
      - run: node scripts/test-activity.js
      - run: node scripts/test-prestige-auto.js
      - run: node scripts/test-auto-ball.js
