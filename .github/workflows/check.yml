name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Só Node: confere sintaxe dos .js e chaves dos .css (sem baixar o Electron).
      - run: node scripts/check.js
