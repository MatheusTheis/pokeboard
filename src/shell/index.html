<!doctype html>
<html lang="pt-BR" data-theme="noite">
<head>
<meta charset="utf-8">
<!-- Fontes do design system vêm do Google Fonts (tokens.css importa); o resto é local. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com">
<title>PokeBoard</title>
<link rel="stylesheet" href="../ui/tokens.css">
<link rel="stylesheet" href="../ui/retro.css">
<link rel="stylesheet" href="shell.css">
</head>
<body>
  <!-- Barra única do topo, como a carcaça da Pokédex: o resto da janela é jogo. -->
  <header class="topbar">
    <span class="pr-lens" aria-hidden="true"></span>
    <span class="pr-leds" aria-hidden="true"><i class="pr-led pr-led--red"></i><i class="pr-led pr-led--yellow"></i><i class="pr-led pr-led--green"></i></span>
    <h1 class="brand">PokeBoard</h1>
    <nav id="accounts" class="accounts" aria-label="Contas (duplo clique renomeia)"></nav>
    <button id="btnAddAccount" class="pr-btn pr-btn--secondary" title="Adicionar outra conta (até 4)">+ Conta</button>
    <div class="seg" role="group" aria-label="Layout">
      <button data-layout="grid" class="pr-btn pr-btn--secondary" title="Tela dividida (Ctrl+0)">Grade</button>
      <button data-layout="focus" class="pr-btn pr-btn--secondary" title="Uma conta grande (Ctrl+1, Ctrl+2…)">Foco</button>
    </div>
    <button id="btnRoute" class="pr-btn pr-btn--secondary" aria-expanded="false" aria-controls="routeBox"
      title="Rota de treino mais eficiente para um Pokémon (Hunt Planner do PIW Tools)">Rota</button>
    <form id="routeBox" class="route-box" hidden autocomplete="off">
      <input id="routeName" class="pr-input" list="routeNames" placeholder="Pokémon" aria-label="Pokémon" required>
      <datalist id="routeNames"></datalist>
      <label class="route-lv">Nv <input id="routeLevel" class="pr-input" type="number" min="1" max="9999" aria-label="Nível atual" required></label>
      <label class="route-lv">→ <input id="routeTarget" class="pr-input" type="number" min="2" max="9999" aria-label="Nível alvo" required></label>
      <button type="submit" class="pr-btn" title="Hunts de maior dano e mais seguras por faixa de nível, na conta em foco">Abrir</button>
      <button type="button" id="routePiw" class="pr-btn pr-btn--secondary"
        title="Rota otimizada do PIW Tools (piwtools.com.br, de Rakupo / bar), numa janela própria">PIW Tools</button>
    </form>
    <span class="spacer"></span>
    <span id="ram" class="ram" title="Memória em uso: GPU (desenho de todas as contas) e total do PokeBoard"></span>
    <button id="btnFps" class="pr-btn pr-btn--secondary" aria-pressed="false"
      title="Economia: limita os quadros por segundo das contas (menos GPU e processador; a animação fica menos lisa). Clique para trocar.">60 fps</button>
    <button id="btnSkin" class="pr-btn pr-btn--secondary" aria-pressed="false"
      title="Ver o jogo com o design original (desliga o visual PokeBoard). Clique de novo para voltar.">Original</button>
    <button id="btnReloadAll" class="pr-btn pr-btn--secondary pr-btn--icon" title="Recarregar todos os painéis" aria-label="Recarregar todos os painéis">↻</button>
    <button id="btnTheme" class="pr-btn pr-btn--secondary pr-btn--icon" title="Editar o tema (theme.css)" aria-label="Editar o tema">✎</button>
    <button id="btnHelp" class="pr-btn pr-btn--secondary pr-btn--icon" aria-label="Atalhos"
      title="Atalhos: Ctrl+1/2… amplia uma conta · Ctrl+0 volta à grade · Ctrl+roda do mouse ou Ctrl+= / Ctrl+- muda o zoom do painel · Alt+P abre a Pokédex+ · duplo clique no nome da conta renomeia">?</button>
  </header>
  <div id="cells"></div>
  <script src="shell.js"></script>
</body>
</html>
